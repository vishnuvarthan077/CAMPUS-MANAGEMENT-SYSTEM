name: CI Pipeline

on:
  push:
    branches:
      - main
      - server
      - client
  pull_request:
    branches:
      - main
      - server
      - client

jobs:
  backend-ci:
    name: Backend CI (Tests & Validation)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./Backend
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/campus_management_ci
          JWT_ACCESS_SECRET: ci_access_secret_super_secure_2026_key
          JWT_REFRESH_SECRET: ci_refresh_secret_super_secure_2026_key
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
        run: npm test

  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Run Frontend Linter
        working-directory: ./Frontend
        run: npm run lint

      - name: Run Frontend Tests (if defined)
        working-directory: ./Frontend
        run: npm run test --if-present

      - name: Build Frontend Application
        working-directory: ./Frontend
        run: npm run build

